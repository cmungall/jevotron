name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token is stored. Configure the publisher on PyPI before the first run.
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # A tag that disagrees with pyproject would publish the wrong version
      # under the right name, and PyPI never lets a file be replaced.
      - name: Check the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          packaged=$(uv run --no-project python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject version $packaged"
            exit 1
          fi
          echo "Publishing version $packaged"

      - name: Build
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
