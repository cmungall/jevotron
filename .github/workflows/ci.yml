name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Report both interpreters rather than cancelling the slower one.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install just
        run: uv tool install rust-just
      # --locked fails on a stale lockfile instead of quietly resolving around it.
      - name: Install project
        run: uv sync --locked --group dev --group docs
      # Same entry point contributors run: lint, tests, strict docs, build.
      - name: Run checks
        run: just check
