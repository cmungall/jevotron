[project]
name = "jevotron"
version = "0.1.0"
description = "Independent, field-level anomaly detection for structured files with Jev"
readme = "README.md"
authors = [
    { name = "Chris Mungall", email = "cjm@berkeleybop.org" }
]
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["anomaly-detection", "data-quality", "ontology", "curation", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "typer>=0.16,<1", "duckdb>=1.4,<2"]

[project.urls]
Homepage = "https://cmungall.github.io/jevotron/"
Documentation = "https://cmungall.github.io/jevotron/"
Repository = "https://github.com/cmungall/jevotron"
Issues = "https://github.com/cmungall/jevotron/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.11", "types-PyYAML>=6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[project.scripts]
jt = "jevotron.cli:main"
jevotron = "jevotron.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
