[project]
name = "jevotron"
version = "0.1.0"
description = "Independent, field-level anomaly detection for structured files with Jev"
readme = "README.md"
authors = [
    { name = "Chris Mungall", email = "cjm@berkeleybop.org" }
]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "typer>=0.16,<1"]

[project.urls]
Repository = "https://github.com/cmungall/jevotron"
Issues = "https://github.com/cmungall/jevotron/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[project.scripts]
jevotron = "jevotron.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
